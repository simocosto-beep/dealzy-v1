plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dealzy.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dealzy.ai'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
