<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dealzy — Set password</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#151823;--muted:#717789;--line:#e7e9f1;--brand:#6557f5;--bad:#b83044}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 60px #27234b12}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#8b3dff,#5367f4,#20c9e8);display:grid;place-items:center;color:#fff;font-weight:900;font-size:26px}
h1{margin:18px 0 8px}.sub{color:var(--muted)}label{display:block;font-weight:800;margin:15px 0 6px}.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.field:focus{border-color:var(--brand)}
.btn{width:100%;border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer;margin-top:16px}.btn-primary{background:var(--brand);color:#fff}.alert{padding:12px 14px;border-radius:12px;margin:14px 0;background:#eef0ff;color:#4338ca}.error{background:#fdebee;color:var(--bad)}
.hidden{display:none!important}@media(max-width:480px){.wrap{align-items:start;padding-top:32px}.card{padding:22px;border-radius:20px}h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">D</div>
    <h1 id="title">Set your password</h1>
    <p id="subtitle" class="sub">Choose a secure password for your Dealzy account.</p>
    <div id="msg"></div>
    <div id="form">
      <label>New password</label>
      <input id="password" class="field" type="password" minlength="12" autocomplete="new-password">
      <label>Confirm password</label>
      <input id="confirmPassword" class="field" type="password" minlength="12" autocomplete="new-password">
      <button id="saveBtn" class="btn btn-primary">Save password</button>
    </div>
  </div>
</div>
<script src="/reset-password.js?v=20260929a"></script>
</body>
</html>
