<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Reset password — Dealzy AI</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#151823;--muted:#717789;--line:#e7e9f1;--brand:#6557f5;--bad:#b83044}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 60px #27234b12}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#8b3dff,#5367f4,#20c9e8);display:grid;place-items:center;color:white;font-weight:900;font-size:26px}
h1{margin:18px 0 8px}.sub{color:var(--muted)}label{display:block;font-weight:750;margin:14px 0 6px}.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.field:focus{border-color:var(--brand)}
.btn{width:100%;border:0;border-radius:12px;padding:12px 15px;font-weight:850;cursor:pointer;background:var(--brand);color:#fff;margin-top:16px}.msg{padding:12px 14px;border-radius:12px;margin:12px 0;background:#eef0ff;color:#4338ca}.msg.bad{background:#fdebee;color:var(--bad)}a{color:var(--brand);font-weight:800;text-decoration:none}
@media(max-width:480px){.wrap{align-items:start;padding-top:32px}.card{padding:22px;border-radius:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">D</div>
    <h1>Choose a new password</h1>
    <p class="sub">Set a new password for your Dealzy account.</p>
    <div id="msg"></div>
    <div id="form">
      <label>New password</label>
      <input id="password" class="field" type="password" minlength="8" autocomplete="new-password">
      <label>Confirm password</label>
      <input id="confirmPassword" class="field" type="password" minlength="8" autocomplete="new-password">
      <button id="saveBtn" class="btn">Save new password</button>
    </div>
    <div id="done" style="display:none">
      <p class="msg">Password updated successfully.</p>
      <p><a href="/">Return to Dealzy AI</a></p>
    </div>
  </div>
</div>
<script>
(()=>{
const SB_URL='https://stkmhgeuavsidpapqvyw.supabase.co';
const SB_KEY='sb_publishable_EVDiDkczLgCmggcMxbV8tw_jQm4g9Rh';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const params=new URLSearchParams(location.hash.replace(/^#/,''));
const token=params.get('access_token');
const type=params.get('type');
if(type!=='recovery'||!token){
  $('#form').style.display='none';
  $('#msg').innerHTML='<div class="msg bad">This reset link is invalid or expired. Request a new password reset email.</div>';
  return;
}
$('#saveBtn').onclick=async()=>{
  const p=$('#password').value,c=$('#confirmPassword').value;
  if(p.length<8){$('#msg').innerHTML='<div class="msg bad">Use at least 8 characters.</div>';return}
  if(p!==c){$('#msg').innerHTML='<div class="msg bad">Passwords do not match.</div>';return}
  $('#saveBtn').disabled=true;
  try{
    const r=await fetch(SB_URL+'/auth/v1/user',{
      method:'PUT',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({password:p})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.msg||data.error_description||'Could not update password');
    history.replaceState(null,'',location.pathname);
    $('#form').style.display='none';$('#msg').innerHTML='';$('#done').style.display='block';
  }catch(e){
    $('#msg').innerHTML='<div class="msg bad">'+esc(e.message)+'</div>';
  }finally{$('#saveBtn').disabled=false}
};
})();
</script>
</body>
</html>
