name: Build Dealzy Play Release

on:
  push:
    branches:
      - release/android-evasion-1.0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.9'

      - name: Validate official Android config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path("app/src/main/java/com/dealzy/ai/MainActivity.java").read_text()
          gradle=Path("app/build.gradle").read_text()
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert 'https://dealzy-v1.vercel.app' in main
          assert 'dealzy-api-staging' not in main
          assert 'appassets.androidplatform.net' not in main
          assert 'webView.loadUrl(PROD_ORIGIN' in main
          assert 'Dealzy-Android/1.0.2' in main
          assert "applicationId 'com.dealzy.ai'" in gradle
          assert "versionCode 3" in gradle
          assert "versionName '1.0.2'" in gradle
          assert 'android:usesCleartextTraffic="false"' in manifest
          print("Official Android release config passed")
          PY

      - name: Probe production web and APIs
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          BASE="https://dealzy-v1.vercel.app"

          with urllib.request.urlopen(BASE+"/",timeout=20) as r:
              html=r.read().decode("utf-8","replace")
          assert "20261014-partners3" in html
          print("PASS homepage")

          with urllib.request.urlopen(BASE+"/api/providers",timeout=20) as r:
              providers=json.load(r)
          assert providers.get("ok") is True
          assert int(providers.get("liveExternalProviders",0)) >= 3
          print("PASS providers",providers.get("liveExternalProviders"))

          checks=[
            ("Food & Drink","Los Angeles","US"),
            ("Things to Do","New York","US"),
            ("Food & Drink","Toronto","CA"),
            ("Things to Do","Montreal","CA"),
          ]
          for category,city,country in checks:
              qs=urllib.parse.urlencode({"category":category,"city":city,"country":country,"limit":"3"})
              with urllib.request.urlopen(BASE+"/api/search?"+qs,timeout=20) as r:
                  data=json.load(r)
              assert data.get("ok") is True, data
              assert data.get("query",{}).get("destination")==city, data
              assert data.get("query",{}).get("country")==country, data
              assert str(data.get("mode","")).startswith("live-"), data
              assert int(data.get("count",0))>0, data
              print("PASS",city,category,data.get("mode"))
          PY

      - name: Build and lint release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Package signing tools and artifacts
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p play-release/signing-tools
          cp app/build/outputs/apk/release/app-release-unsigned.apk play-release/Dealzy-AI-v1.0.2-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab play-release/Dealzy-AI-v1.0.2-unsigned.aab
          cp "$SDKROOT/build-tools/35.0.0/lib/apksigner.jar" play-release/signing-tools/apksigner.jar
          sha256sum play-release/Dealzy-AI-v1.0.2-unsigned.apk play-release/Dealzy-AI-v1.0.2-unsigned.aab > play-release/SHA256SUMS.txt
          cp app/build/reports/lint-results-release.html play-release/
          ls -lh play-release play-release/signing-tools

      - name: Upload unsigned release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Dealzy-Play-Release-Unsigned-v1.0.2
          path: play-release/
          if-no-files-found: error
          retention-days: 7
