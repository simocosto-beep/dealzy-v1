name: Build Dealzy Android RC APK

on:
  push:
    branches:
      - android/personalized-safe-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare embedded Dealzy web app
        run: |
          mkdir -p app/src/main/assets
          cp index.html dealzy-live.js dealzy-tools.js dealzy-providers.js dealzy-i18n.js app/src/main/assets/
          cp icon.svg manifest.webmanifest privacy.html affiliate-disclosure.html app/src/main/assets/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/dealzy-tools.js")
          s=p.read_text()
          target="navigator.serviceWorker.register('/sw.js')"
          if target not in s:
              raise SystemExit("Service worker registration call not found")
          s=s.replace(target,"Promise.reject(new Error('native-apk-service-worker-disabled'))")
          p.write_text(s)
          PY

      - name: Validate embedded interaction guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          live=Path("app/src/main/assets/dealzy-live.js").read_text()
          index=Path("app/src/main/assets/index.html").read_text()
          assert "showOnboarding(true)" not in live
          assert "$$('.navBtn').forEach(b=>b.onclick=()=>show(b.dataset.view))" in index
          for view in ["home","explore","favorites","trips","profile"]:
              assert f'data-view="{view}"' in index
          print("Interaction guard passed")
          PY

      - name: Gate RC on Railway staging
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request

          BASE="https://dealzy-api-staging-production.up.railway.app"

          def get(path, attempts=12):
              last=None
              for i in range(attempts):
                  try:
                      with urllib.request.urlopen(BASE+path, timeout=15) as r:
                          if r.status != 200:
                              raise RuntimeError(f"HTTP {r.status}")
                          return json.load(r)
                  except Exception as e:
                      last=e
                      if i+1 < attempts:
                          time.sleep(5)
              raise SystemExit(f"Railway staging unavailable: {last}")

          health=get("/health")
          assert health.get("ok") is True, health

          providers=get("/api/providers")
          assert providers.get("ok") is True, providers
          assert int(providers.get("liveExternalProviders",0)) >= 3, providers

          checks=[
              ("Food & Drink","Los Angeles","US","Los Angeles"),
              ("Things to Do","New York","US","New York"),
              ("Things to Do","Toronto","CA","Toronto"),
          ]
          for category,city,country,expected in checks:
              qs=urllib.parse.urlencode({
                  "category":category,
                  "city":city,
                  "country":country,
                  "limit":"5"
              })
              data=get("/api/search?"+qs)
              query=data.get("query") or {}
              assert query.get("destination")==expected, (expected,query)
              assert data.get("mode","").startswith("live-"), data
              assert int(data.get("count",0)) > 0, data
              places=" | ".join(str(x.get("place","")) for x in data.get("results",[]))
              assert expected.lower() in places.lower(), (expected,places)
              print(f"PASS {city}: {data.get('mode')} · {data.get('count')} results")

          print("Railway RC gate passed")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dealzy-AI-RC1.apk
          ls -lh Dealzy-AI-RC1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dealzy-AI-RC1
          path: Dealzy-AI-RC1.apk
          if-no-files-found: error
          retention-days: 7
