name: Build Dealzy Android Test APK

on:
  push:
    branches:
      - android/personalized-safe-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare embedded Dealzy web app
        run: |
          mkdir -p app/src/main/assets
          cp index.html dealzy-live.js dealzy-tools.js dealzy-providers.js dealzy-i18n.js app/src/main/assets/
          cp icon.svg manifest.webmanifest privacy.html affiliate-disclosure.html app/src/main/assets/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/dealzy-tools.js")
          s=p.read_text()
          target="navigator.serviceWorker.register('/sw.js')"
          if target not in s:
              raise SystemExit("Service worker registration call not found")
          s=s.replace(target,"Promise.reject(new Error('native-apk-service-worker-disabled'))")
          p.write_text(s)
          PY

      - name: Validate embedded interaction guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          live=Path("app/src/main/assets/dealzy-live.js").read_text()
          index=Path("app/src/main/assets/index.html").read_text()
          assert "showOnboarding(true)" not in live
          assert "$$('.navBtn').forEach(b=>b.onclick=()=>show(b.dataset.view))" in index
          for view in ["home","explore","favorites","trips","profile"]:
              assert f'data-view="{view}"' in index
          print("Interaction guard passed")
          PY

      - name: Probe staging API
        continue-on-error: true
        run: |
          BASE="https://dealzy-v1-git-android-personali-371ee4-simocosto-5501s-projects.vercel.app"
          echo "== /api/providers =="
          curl -L -sS -D /tmp/providers.headers -o /tmp/providers.body "$BASE/api/providers" || true
          head -n 20 /tmp/providers.headers || true
          head -c 2000 /tmp/providers.body || true
          echo
          echo "== /api/search New York =="
          curl -L -sS -D /tmp/search.headers -o /tmp/search.body "$BASE/api/search?category=Food%20%26%20Drink&country=US&city=New%20York&limit=3" || true
          head -n 20 /tmp/search.headers || true
          head -c 3000 /tmp/search.body || true
          echo

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dealzy-AI-Personalized-Safe-Test.apk
          ls -lh Dealzy-AI-Personalized-Safe-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dealzy-AI-Personalized-Safe-Test
          path: Dealzy-AI-Personalized-Safe-Test.apk
          if-no-files-found: error
          retention-days: 7
